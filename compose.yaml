services:
  codexapp-fork:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codexapp-fork
    restart: unless-stopped
    env_file:
      - ./deploy/codexapp-fork.env
    environment:
      NODE_ENV: production
      HOME: /root
      CODEX_HOME: /root/.codex
      SHELL: /bin/bash
      # Use the host Xray SOCKS proxy without exposing it to public interfaces.
      HTTP_PROXY: "socks5h://host.docker.internal:10808"
      HTTPS_PROXY: "socks5h://host.docker.internal:10808"
      ALL_PROXY: "socks5h://host.docker.internal:10808"
      NO_PROXY: "localhost,127.0.0.1,::1,.fastonetech.com,.fastone.cc"
      http_proxy: "socks5h://host.docker.internal:10808"
      https_proxy: "socks5h://host.docker.internal:10808"
      all_proxy: "socks5h://host.docker.internal:10808"
      no_proxy: "localhost,127.0.0.1,::1,.fastonetech.com,.fastone.cc"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CODEXAPP_HOST_PORT:-5910}:5900"
    volumes:
      - "${CODEXAPP_ROOT_HOME:-./runtime/root-home}:/root"
      - "${CODEXAPP_WORKSPACE_DIR:-./runtime/workspace}:/workspace"
      # Read-only SSH credentials for Git operations; never copy keys into the image.
      - "${CODEXAPP_SSH_DIR:-/root/.ssh}:/root/.ssh:ro"
    working_dir: /workspace
    command:
      - /workspace
      - --no-tunnel
      - --no-open
      - --no-login
      - --port
      - "5900"
      - --password
      - "${CODEXAPP_PASSWORD:?set CODEXAPP_PASSWORD in deploy/codexapp-fork.env}"
      - --sandbox-mode
      - danger-full-access
      - --approval-policy
      - never
